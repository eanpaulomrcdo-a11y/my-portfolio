<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>My Poetry | The Other Side of Me</title>
    <link rel="icon" type="image/png" href="images/IPM_Logo.png">
    <link rel="stylesheet" href="css/other-side.css">
    <link rel="stylesheet" href="css/poetry.css">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="index.html">IPM<span>.</span></a>
        <nav aria-label="Main navigation">
            <a href="index.html">Professional Portfolio</a>
            <a href="other-side.html">The Other Side of Me</a>
        </nav>
    </header>
    <main class="poetry-page">
        <section class="poetry-intro">
            <p class="eyebrow">THE WRITTEN WORD</p>
            <h1>My <em>Poetry.</em></h1>
            <p>A small collection of thoughts, feelings, and moments given a place in words.</p>
            <a class="text-link" href="other-side.html">← Back to The Other Side of Me</a>
        </section>
        <section class="poetry-stage" aria-label="Poetry collection">
            <div class="poetry-view" id="poetryCollectionView">
                <div class="poetry-stage-heading">
                    <div>
                        <p class="eyebrow">THE COLLECTION</p>
                        <h2>Choose a piece to read.</h2>
                    </div>
                    <span class="collection-count">03 PIECES</span>
                </div>
                <div class="poem-list" id="poemList" aria-label="Poems"></div>
            </div>
            <article class="poetry-view poem-reader" id="poemReaderView" hidden aria-live="polite">
                <button class="back-to-poetry" id="backToPoetry" type="button">← Back to Poetry</button>
                <p class="eyebrow" id="readerCategory"></p>
                <h2 id="readerTitle"></h2>
                <div class="reader-rule"></div>
                <div class="poem-reader-text" id="readerText"></div>
            </article>
        </section>
    </main>
    <footer><p>© 2026 Ian Paulo Mercado · The Other Side of Me</p></footer>
    <script src="js/poetry.js" defer></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPM: Space Defender</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         MAIN GAME CONTAINER
         ========================================= -->

    <main class="game-container">

        <!-- GAME HEADER -->
        <header class="game-header">

            <h1>IPM: SPACE DEFENDER</h1>

            <p>Defend the galaxy. Survive as long as you can.</p>

        </header>


        <!-- GAME SCREEN -->
        <section class="game-screen">

            <canvas id="gameCanvas" width="900" height="500"></canvas>

        </section>


        <!-- GAME CONTROLS -->
        <footer class="game-controls">

            <p>↑ ↓ ← → &nbsp; MOVE YOUR SPACESHIP</p>

            <p>AUTO FIRE ENABLED</p>

            <button id="pauseButton">START GAME</button>

        </footer>

    </main>


    <!-- GAME JAVASCRIPT -->
    <script src="game.js"></script>

</body>
</html>
